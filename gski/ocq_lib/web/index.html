<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ocq</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script>try { const t = localStorage.getItem("ocq-theme"); if (t) document.documentElement.dataset.theme = t; } catch {}</script>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app">
    <aside>
      <div class="brand">
        <span id="srv" class="dot" title="server status"></span>
        <span>ocq</span>
        <button id="theme" class="theme" title="toggle theme"></button>
      </div>
      <div id="projects"></div>
    </aside>
    <main id="main">
      <div class="empty muted">No runs yet.</div>
    </main>
  </div>
  <script src="/app.js"></script>
</body>
</html>
